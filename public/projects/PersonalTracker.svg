<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.04" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1050" cy="80" r="260" fill="url(#accent)" fill-opacity="0.12"/>
  <circle cx="120" cy="600" r="220" fill="url(#accent)" fill-opacity="0.10"/>

  <!-- Title -->
  <rect x="80" y="88" width="14" height="14" rx="4" fill="url(#accent)"/>
  <text x="106" y="101" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#a5b4fc" letter-spacing="3">PERSONAL TRACKER</text>
  <text x="80" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#f8fafc">Everything, in one place.</text>
  <text x="80" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">A simple PWA for money, EMIs, events &amp; schedule</text>

  <!-- Tiles -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- Money -->
    <rect x="80" y="260" width="245" height="150" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="104" y="284" width="36" height="36" rx="10" fill="#22c55e" fill-opacity="0.18"/>
    <text x="122" y="309" text-anchor="middle" font-size="18" fill="#4ade80">₹</text>
    <text x="104" y="352" font-size="14" fill="#94a3b8">Money</text>
    <text x="104" y="384" font-size="26" font-weight="700" fill="#f8fafc">₹48,200</text>

    <!-- EMI -->
    <rect x="345" y="260" width="245" height="150" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="369" y="284" width="36" height="36" rx="10" fill="#f59e0b" fill-opacity="0.18"/>
    <path d="M379 310l6-6 5 5 8-9" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="369" y="352" font-size="14" fill="#94a3b8">EMI due</text>
    <text x="369" y="384" font-size="26" font-weight="700" fill="#f8fafc">3 this month</text>

    <!-- Events -->
    <rect x="610" y="260" width="245" height="150" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="634" y="284" width="36" height="36" rx="10" fill="#ec4899" fill-opacity="0.18"/>
    <rect x="644" y="295" width="16" height="14" rx="3" stroke="#f472b6" stroke-width="2"/>
    <path d="M644 300h16" stroke="#f472b6" stroke-width="2"/>
    <text x="634" y="352" font-size="14" fill="#94a3b8">Events</text>
    <text x="634" y="384" font-size="26" font-weight="700" fill="#f8fafc">2 upcoming</text>

    <!-- Schedule -->
    <rect x="875" y="260" width="245" height="150" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="899" y="284" width="36" height="36" rx="10" fill="#6366f1" fill-opacity="0.18"/>
    <circle cx="917" cy="302" r="8" stroke="#818cf8" stroke-width="2"/>
    <path d="M917 297v5l3 2" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    <text x="899" y="352" font-size="14" fill="#94a3b8">Schedule</text>
    <text x="899" y="384" font-size="26" font-weight="700" fill="#f8fafc">Today · 5 tasks</text>

    <!-- Bars -->
    <rect x="80" y="440" width="1040" height="110" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="104" y="470" font-size="14" fill="#94a3b8">Monthly spend</text>
    <g fill="url(#accent)" fill-opacity="0.85">
      <rect x="104" y="510" width="60" height="22" rx="6"/>
      <rect x="176" y="500" width="60" height="32" rx="6"/>
      <rect x="248" y="492" width="60" height="40" rx="6"/>
      <rect x="320" y="506" width="60" height="26" rx="6"/>
      <rect x="392" y="486" width="60" height="46" rx="6"/>
      <rect x="464" y="498" width="60" height="34" rx="6"/>
      <rect x="536" y="480" width="60" height="52" rx="6"/>
      <rect x="608" y="494" width="60" height="38" rx="6"/>
      <rect x="680" y="504" width="60" height="28" rx="6"/>
      <rect x="752" y="484" width="60" height="48" rx="6"/>
      <rect x="824" y="496" width="60" height="36" rx="6"/>
      <rect x="896" y="490" width="60" height="42" rx="6"/>
    </g>
    <rect x="1000" y="484" width="96" height="30" rx="15" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.35"/>
    <text x="1048" y="504" text-anchor="middle" font-size="13" font-weight="600" fill="#4ade80">PWA · Offline</text>
  </g>
</svg>
